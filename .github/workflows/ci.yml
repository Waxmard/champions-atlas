name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            .cache/catalog
            .cache/jev
            src/lib/data/catalog.json
            static/sprites
            static/items
          key: catalog-${{ runner.os }}-${{ hashFiles('scripts/**', 'package-lock.json') }}
          restore-keys: |
            catalog-${{ runner.os }}-
          save-always: true
      - name: Run CI checks
        run: make ci
