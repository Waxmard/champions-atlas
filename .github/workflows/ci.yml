name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      VITE_BUILD_ID: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            .cache/catalog
            .cache/jev
            src/lib/data/catalog.json
            static/sprites
            static/items
            static/posts
          key: catalog-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            catalog-${{ runner.os }}-
          save-always: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install browsers while checks run
        run: |
          npx playwright install --with-deps chromium webkit > /tmp/playwright-install.log 2>&1 &
          install=$!
          make ci
          wait "$install" || { cat /tmp/playwright-install.log; exit 1; }
          cat /tmp/playwright-install.log
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
