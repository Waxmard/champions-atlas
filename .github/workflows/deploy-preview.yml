name: Deploy Preview

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    if: contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    runs-on: ubuntu-24.04
    environment: preview
    steps:
      - uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - uses: jdx/mise-action@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - run: npx firebase-tools deploy --only firestore:rules --project champions-atlas-test --token "${{ secrets.FIREBASE_TOKEN }}"
      - name: Deploy preview channel
        id: channel
        run: |
          output=$(npx firebase-tools hosting:channel:deploy preview --project champions-atlas-test --token "${{ secrets.FIREBASE_TOKEN }}" --json)
          echo "$output" | jq '.result'
          echo "url=$(echo "$output" | jq -r '.result | to_entries[0].value.url')" >> "$GITHUB_OUTPUT"
      - uses: marocchino/sticky-pull-request-comment@v3 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          header: deploy-preview
          message: |
            Preview deployed: ${{ steps.channel.outputs.url }}
