name: Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            .cache/catalog
            .cache/jev
            src/lib/data/catalog.json
            static/sprites
            static/items
          key: catalog-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            catalog-${{ runner.os }}-
      - uses: jdx/mise-action@v4
      - run: npm ci
      - name: Enrich team tags
        run: |
          node scripts/import-catalog.mjs --if-missing
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo '::error::TYPESAFE_API_KEY is not configured; refusing to deploy untagged.'
            exit 1
          fi
          npm run enrich:tags
        env:
          CHECK_SHEET: '1'
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      - run: npm run build
        env:
          CHECK_SHEET: '1'
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - run: npx firebase-tools deploy --only hosting,firestore:rules --project champions-atlas --token "${{ secrets.FIREBASE_TOKEN }}"
