pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,mjs,ts,svelte,json,css,md,yml,yaml}'
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,mjs,ts,svelte}'
      run: npx eslint --max-warnings 0 {staged_files}
    line-limit:
      glob: '*.{mjs,ts,svelte,css}'
      run: bash scripts/check-line-limit.sh {staged_files}
    doc-budgets:
      glob: '{AGENTS.md,doc-budgets.json}'
      run: bash scripts/check-doc-budgets.sh
    no-comments:
      glob: '*.{js,mjs,ts,svelte,py}'
      run: python3 scripts/check-comments.py {staged_files}
